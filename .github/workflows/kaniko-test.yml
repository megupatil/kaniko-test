name: Kaniko OCI Annotation + GKE Deploy

on:
  workflow_dispatch:
    inputs:
      image_version:
        description: "Container image version"
        required: true
        default: "3.0.0"
        type: string

env:
  PROJECT_ID: clgcporg193-p001

  GKE_CLUSTER: kaniko-test
  GKE_REGION: us-central1

  GAR_LOCATION: us-central1
  GAR_REPOSITORY: kaniko-test
  IMAGE_NAME: kaniko-test

  OCI_SOURCE: https://github.com/megupatil/kaniko-test
  KANIKO_IMAGE: ghcr.io/osscontainertools/kaniko:v1.28.0

jobs:
  kaniko-oci-annotation:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      # 1. Checkout source
      - name: Checkout repository
        uses: actions/checkout@v5

      # 2. Authenticate to Google Cloud
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}'

      # 3. Configure gcloud
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      # 4. Buildx is used only to inspect the OCI manifest
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      # 5. Validate Kaniko annotation support
      - name: Verify Kaniko annotation support
        run: |
          docker run --rm \
            "${KANIKO_IMAGE}" \
            --help > /tmp/kaniko-help.txt

          grep -q -- "--annotation" /tmp/kaniko-help.txt

      # 6. Build and push image with Kaniko
      # GitHub-hosted runners launch the Kaniko executor as a container.
      - name: Build and push image with Kaniko
        run: |
          GAR_IMAGE="${GAR_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}"
          IMAGE_TAG="v${{ github.event.inputs.image_version }}-stage"

          echo "Image: ${GAR_IMAGE}:${IMAGE_TAG}"
          echo "Source: ${OCI_SOURCE}"

          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -v "${GOOGLE_APPLICATION_CREDENTIALS}:/workspace/gcp-key.json:ro" \
            -e GOOGLE_APPLICATION_CREDENTIALS=/workspace/gcp-key.json \
            "${KANIKO_IMAGE}" \
            --dockerfile=/workspace/Dockerfile \
            --context=dir:///workspace \
            --destination="${GAR_IMAGE}:${IMAGE_TAG}" \
            --annotation "org.opencontainers.image.source=${OCI_SOURCE}"

      # 7. Authenticate Docker for GAR manifest inspection
      - name: Configure Docker authentication for GAR
        run: |
          gcloud auth configure-docker \
            "${GAR_LOCATION}-docker.pkg.dev" \
            --quiet

      # 8. Verify image in Artifact Registry
      - name: Verify image in Artifact Registry
        run: |
          GAR_IMAGE="${GAR_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}"
          IMAGE_TAG="v${{ github.event.inputs.image_version }}-stage"

          gcloud artifacts docker images describe \
            "${GAR_IMAGE}:${IMAGE_TAG}" \
            --format="yaml(name,version,updateTime)"

      # 9. Verify OCI manifest annotation
      - name: Verify OCI manifest annotation
        run: |
          GAR_IMAGE="${GAR_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}"
          IMAGE_TAG="v${{ github.event.inputs.image_version }}-stage"

          docker buildx imagetools inspect \
            "${GAR_IMAGE}:${IMAGE_TAG}" \
            --raw

      # 10. Get GKE credentials
      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_REGION }}
          project_id: ${{ env.PROJECT_ID }}

      # 11. Deploy Kubernetes manifests
      - name: Deploy Kubernetes manifests
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml

      # 12. Deploy the annotated image
      - name: Set deployed image
        run: |
          GAR_IMAGE="${GAR_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}"
          IMAGE_TAG="v${{ github.event.inputs.image_version }}-stage"

          kubectl set image deployment/kaniko-test \
            kaniko-test="${GAR_IMAGE}:${IMAGE_TAG}"

      # 13. Wait for rollout
      - name: Wait for rollout
        run: |
          kubectl rollout status \
            deployment/kaniko-test \
            --timeout=180s

      # 14. Verify deployed image
      - name: Verify deployed image
        run: |
          echo "Deployment image:"
          kubectl get deployment kaniko-test \
            -o jsonpath='{.spec.template.spec.containers[0].image}'
          echo

          echo "Running image:"
          kubectl get pods \
            -l app=kaniko-test \
            -o jsonpath='{range .items[*]}{.metadata.name}{" -> "}{.status.containerStatuses[0].image}{"\n"}{end}'

          echo "Running digest:"
          kubectl get pods \
            -l app=kaniko-test \
            -o jsonpath='{range .items[*]}{.metadata.name}{" -> "}{.status.containerStatuses[0].imageID}{"\n"}{end}'

      # 15. Final status
      - name: Final verification
        run: |
          kubectl get deployment kaniko-test
          kubectl get pods -l app=kaniko-test -o wide
          kubectl get service kaniko-test
