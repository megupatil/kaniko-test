name: Kaniko Build + Wiz OCI Annotation + GKE Deploy

on:
  workflow_dispatch:
    inputs:
      image_version:
        description: "Container image version"
        required: true
        default: "1.0.0"
        type: string

env:
  PROJECT_ID: clgcporg193-p001

  GKE_CLUSTER: kaniko-test
  GKE_REGION: us-central1

  GAR_LOCATION: us-central1
  GAR_REPOSITORY: kaniko-test
  IMAGE_NAME: kaniko-test

  # Git repository used for OCI manifest correlation
  OCI_SOURCE: https://github.com/megupatil/kaniko-test

  # Pin the maintained Kaniko version for reproducibility
  KANIKO_IMAGE: ghcr.io/osscontainertools/kaniko:v1.28.0

jobs:
  kaniko-build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      # ==================================================
      # 1. Checkout repository
      # ==================================================

      - name: Checkout repository
        uses: actions/checkout@v5

      # ==================================================
      # 2. Install Wiz CLI
      # ==================================================

      - name: Install Wiz CLI
        run: |
          curl -Lo wizcli \
            https://downloads.wiz.io/v1/wizcli/latest/wizcli-linux-amd64

          chmod +x wizcli

          echo "=============================================="
          echo "WIZ CLI VERSION"
          echo "=============================================="

          ./wizcli version

      # ==================================================
      # 3. Validate Wiz CLI commands
      # ==================================================

      - name: Validate Wiz CLI commands
        run: |
          echo "=============================================="
          echo "WIZ SCAN CONTAINER-IMAGE HELP"
          echo "=============================================="

          ./wizcli scan container-image --help

          echo "=============================================="
          echo "WIZ TAG HELP"
          echo "=============================================="

          ./wizcli tag --help

      # ==================================================
      # 4. Validate Kaniko annotation support
      #
      # This checks the exact Kaniko image used below.
      # ==================================================

      - name: Validate Kaniko annotation support
        run: |
          echo "=============================================="
          echo "KANIKO VERSION"
          echo "=============================================="

          docker run --rm \
            "${KANIKO_IMAGE}" \
            version

          echo "=============================================="
          echo "KANIKO ANNOTATION SUPPORT"
          echo "=============================================="

          docker run --rm \
            "${KANIKO_IMAGE}" \
            --help > /tmp/kaniko-help.txt

          if grep -q -- "--annotation" /tmp/kaniko-help.txt; then
            echo "Kaniko supports --annotation"
          else
            echo "ERROR: ${KANIKO_IMAGE} does not expose --annotation"
            echo
            grep -A5 -B5 "annotation" /tmp/kaniko-help.txt || true
            exit 1
          fi

      # ==================================================
      # 5. Authenticate to Wiz
      # ==================================================

      - name: Authenticate to Wiz
        env:
          WIZ_CLIENT_ID: ${{ secrets.WIZ_CLIENT_ID }}
          WIZ_CLIENT_SECRET: ${{ secrets.WIZ_CLIENT_SECRET }}
        run: |
          ./wizcli auth \
            --id "$WIZ_CLIENT_ID" \
            --secret "$WIZ_CLIENT_SECRET"

      # ==================================================
      # 6. Source repository scan
      #
      # Reporting only.
      # ==================================================

      - name: Scan repository with Wiz CLI
        continue-on-error: true
        run: |
          echo "=============================================="
          echo "WIZ SOURCE REPOSITORY SCAN"
          echo "=============================================="

          ./wizcli dir scan --path .

      # ==================================================
      # 7. Authenticate to Google Cloud
      # ==================================================

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}'

      # ==================================================
      # 8. Setup gcloud
      # ==================================================

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      # ==================================================
      # 9. Configure Docker for Artifact Registry
      # ==================================================

      - name: Configure Docker
        run: |
          gcloud auth configure-docker \
            "${GAR_LOCATION}-docker.pkg.dev" \
            --quiet

      # ==================================================
      # 10. Build image with Kaniko + OCI annotation
      #
      # IMPORTANT:
      # - Kaniko remains the builder.
      # - Image is built without pushing.
      # - Manifest-level OCI annotation is added.
      # ==================================================

      - name: Build image with Kaniko
        run: |
          GAR_IMAGE="${GAR_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}"
          IMAGE_VERSION="${{ github.event.inputs.image_version }}"

          echo "=============================================="
          echo "KANIKO BUILD"
          echo "=============================================="

          echo "Kaniko:"
          echo "${KANIKO_IMAGE}"

          echo "Image:"
          echo "${IMAGE_NAME}:${IMAGE_VERSION}"

          echo "Git SHA:"
          echo "${GITHUB_SHA}"

          echo "OCI annotation:"
          echo "org.opencontainers.image.source=${OCI_SOURCE}"

          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            "${KANIKO_IMAGE}" \
            --dockerfile=/workspace/Dockerfile \
            --context=dir:///workspace \
            --destination="${IMAGE_NAME}:${IMAGE_VERSION}" \
            --no-push \
            --tar-path=/workspace/image.tar \
            --annotation "org.opencontainers.image.source=${OCI_SOURCE}"

      # ==================================================
      # 11. Verify Kaniko output
      # ==================================================

      - name: Verify Kaniko image archive
        run: |
          echo "=============================================="
          echo "KANIKO IMAGE ARCHIVE"
          echo "=============================================="

          ls -lh image.tar

      # ==================================================
      # 12. Load Kaniko image into Docker
      # ==================================================

      - name: Load Kaniko image
        run: |
          echo "=============================================="
          echo "LOAD KANIKO IMAGE"
          echo "=============================================="

          docker load -i image.tar

          echo "=============================================="
          echo "LOCAL IMAGES"
          echo "=============================================="

          docker images

      # ==================================================
      # 13. Create GAR-qualified local tags
      # ==================================================

      - name: Tag image for Artifact Registry
        run: |
          GAR_IMAGE="${GAR_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}"
          IMAGE_VERSION="${{ github.event.inputs.image_version }}"

          echo "=============================================="
          echo "GAR IMAGE REFERENCES"
          echo "=============================================="

          echo "${GAR_IMAGE}:${IMAGE_VERSION}"
          echo "${GAR_IMAGE}:${GITHUB_SHA}"
          echo "${GAR_IMAGE}:latest"

          docker tag \
            "${IMAGE_NAME}:${IMAGE_VERSION}" \
            "${GAR_IMAGE}:${IMAGE_VERSION}"

          docker tag \
            "${IMAGE_NAME}:${IMAGE_VERSION}" \
            "${GAR_IMAGE}:${GITHUB_SHA}"

          docker tag \
            "${IMAGE_NAME}:${IMAGE_VERSION}" \
            "${GAR_IMAGE}:latest"

          docker images "${GAR_IMAGE}"

      # ==================================================
      # 14. Scan the OCI-annotated image with Wiz
      #
      # Reporting only.
      # ==================================================

      - name: Scan annotated image with Wiz CLI
        continue-on-error: true
        run: |
          GAR_IMAGE="${GAR_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}"
          IMAGE_VERSION="${{ github.event.inputs.image_version }}"

          echo "=============================================="
          echo "WIZ CONTAINER IMAGE SCAN"
          echo "=============================================="

          echo "Image:"
          echo "${GAR_IMAGE}:${IMAGE_VERSION}"

          echo "Dockerfile:"
          echo "${GITHUB_WORKSPACE}/Dockerfile"

          echo "OCI source:"
          echo "${OCI_SOURCE}"

          echo "=============================================="
          echo "WIZ SCAN RESULTS"
          echo "=============================================="

          ./wizcli scan container-image \
            "${GAR_IMAGE}:${IMAGE_VERSION}" \
            --dockerfile "${GITHUB_WORKSPACE}/Dockerfile"

      # ==================================================
      # 15. Push image to Artifact Registry
      # ==================================================

      - name: Push image to Artifact Registry
        run: |
          GAR_IMAGE="${GAR_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}"
          IMAGE_VERSION="${{ github.event.inputs.image_version }}"

          echo "=============================================="
          echo "PUSH TO ARTIFACT REGISTRY"
          echo "=============================================="

          docker push "${GAR_IMAGE}:${IMAGE_VERSION}"
          docker push "${GAR_IMAGE}:${GITHUB_SHA}"
          docker push "${GAR_IMAGE}:latest"

      # ==================================================
      # 16. Verify image in Artifact Registry
      # ==================================================

      - name: Verify image in Artifact Registry
        run: |
          GAR_IMAGE="${GAR_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}"
          IMAGE_VERSION="${{ github.event.inputs.image_version }}"

          echo "=============================================="
          echo "ARTIFACT REGISTRY IMAGE"
          echo "=============================================="

          gcloud artifacts docker images describe \
            "${GAR_IMAGE}:${IMAGE_VERSION}" \
            --format="yaml(name,version,updateTime)"

      # ==================================================
      # 17. Inspect OCI manifest
      #
      # This is the key validation step.
      # ==================================================

      - name: Verify OCI manifest annotation
        run: |
          GAR_IMAGE="${GAR_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}"
          IMAGE_VERSION="${{ github.event.inputs.image_version }}"

          echo "=============================================="
          echo "OCI MANIFEST"
          echo "=============================================="

          docker buildx imagetools inspect \
            "${GAR_IMAGE}:${IMAGE_VERSION}" \
            --raw

      # ==================================================
      # 18. Wiz digest enrichment
      #
      # Keep this if you want both the OCI annotation
      # test and the existing Wiz digest enrichment.
      # ==================================================

      - name: Tag image in Wiz
        continue-on-error: true
        run: |
          GAR_IMAGE="${GAR_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}"
          IMAGE_VERSION="${{ github.event.inputs.image_version }}"

          echo "=============================================="
          echo "WIZ DIGEST ENRICHMENT"
          echo "=============================================="

          ./wizcli tag \
            "${GAR_IMAGE}:${IMAGE_VERSION}"

      # ==================================================
      # 19. Get GKE credentials
      # ==================================================

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_REGION }}
          project_id: ${{ env.PROJECT_ID }}

      # ==================================================
      # 20. Deploy Kubernetes manifests
      # ==================================================

      - name: Deploy Kubernetes manifests
        run: |
          echo "=============================================="
          echo "DEPLOY KUBERNETES MANIFESTS"
          echo "=============================================="

          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml

      # ==================================================
      # 21. Deploy exact version
      # ==================================================

      - name: Set deployed image
        run: |
          GAR_IMAGE="${GAR_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}"
          IMAGE_VERSION="${{ github.event.inputs.image_version }}"

          echo "=============================================="
          echo "DEPLOY IMAGE"
          echo "=============================================="

          echo "${GAR_IMAGE}:${IMAGE_VERSION}"

          kubectl set image deployment/kaniko-test \
            kaniko-test="${GAR_IMAGE}:${IMAGE_VERSION}"

      # ==================================================
      # 22. Check deployment state
      # ==================================================

      - name: Check deployment state
        run: |
          echo "=============================================="
          echo "DEPLOYMENT"
          echo "=============================================="

          kubectl get deployment kaniko-test -o wide

          echo "=============================================="
          echo "REPLICASETS"
          echo "=============================================="

          kubectl get replicasets -l app=kaniko-test

          echo "=============================================="
          echo "PODS"
          echo "=============================================="

          kubectl get pods \
            -l app=kaniko-test \
            -o wide

          echo "=============================================="
          echo "EVENTS"
          echo "=============================================="

          kubectl get events \
            --sort-by=.lastTimestamp | tail -50

      # ==================================================
      # 23. Wait for rollout
      # ==================================================

      - name: Wait for rollout
        run: |
          kubectl rollout status \
            deployment/kaniko-test \
            --timeout=180s

      # ==================================================
      # 24. Verify deployed image
      # ==================================================

      - name: Verify deployed image
        run: |
          echo "=============================================="
          echo "DEPLOYMENT IMAGE"
          echo "=============================================="

          kubectl get deployment kaniko-test \
            -o jsonpath='{.spec.template.spec.containers[0].image}'

          echo

          echo "=============================================="
          echo "RUNNING POD IMAGE"
          echo "=============================================="

          kubectl get pods \
            -l app=kaniko-test \
            -o jsonpath='{range .items[*]}{.metadata.name}{" -> "}{.status.containerStatuses[0].image}{"\n"}{end}'

          echo "=============================================="
          echo "RUNNING IMAGE DIGEST"
          echo "=============================================="

          kubectl get pods \
            -l app=kaniko-test \
            -o jsonpath='{range .items[*]}{.metadata.name}{" -> "}{.status.containerStatuses[0].imageID}{"\n"}{end}'

      # ==================================================
      # 25. Final verification
      # ==================================================

      - name: Verify deployment
        run: |
          echo "=============================================="
          echo "FINAL DEPLOYMENT"
          echo "=============================================="

          kubectl get deployment kaniko-test

          echo "=============================================="
          echo "FINAL PODS"
          echo "=============================================="

          kubectl get pods \
            -l app=kaniko-test \
            -o wide

          echo "=============================================="
          echo "SERVICE"
          echo "=============================================="

          kubectl get service kaniko-test
