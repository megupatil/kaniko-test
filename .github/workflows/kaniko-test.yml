name: Kaniko Build + Wiz CLI Scan + GKE Deploy

on:
  workflow_dispatch:

env:
  PROJECT_ID: clgcporg193-p001

  GKE_CLUSTER: kaniko-test
  GKE_REGION: us-central1

  GAR_LOCATION: us-central1
  GAR_REPOSITORY: kaniko-test
  IMAGE_NAME: kaniko-test

jobs:
  kaniko-build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v5

      # --------------------------------------------------
      # 2. Install Wiz CLI
      # --------------------------------------------------

      - name: Install Wiz CLI
        run: |
          curl -Lo wizcli https://downloads.wiz.io/v1/wizcli/latest/wizcli-linux-amd64
          chmod +x wizcli
          ./wizcli version

      # --------------------------------------------------
      # 3. Authenticate to Wiz
      # --------------------------------------------------

      - name: Authenticate to Wiz
        env:
          WIZ_CLIENT_ID: ${{ secrets.WIZ_CLIENT_ID }}
          WIZ_CLIENT_SECRET: ${{ secrets.WIZ_CLIENT_SECRET }}
        run: |
          ./wizcli auth \
            --id "$WIZ_CLIENT_ID" \
            --secret "$WIZ_CLIENT_SECRET"

      # --------------------------------------------------
      # 4. Scan repository with Wiz
      # --------------------------------------------------

      - name: Scan repository with Wiz CLI
        run: |
          ./wizcli dir scan --path .

      # --------------------------------------------------
      # 5. Authenticate to Google Cloud
      # --------------------------------------------------

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}'

      # --------------------------------------------------
      # 6. Setup gcloud
      # --------------------------------------------------

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      # --------------------------------------------------
      # 7. Configure Docker for Artifact Registry
      # --------------------------------------------------

      - name: Configure Docker
        run: |
          gcloud auth configure-docker \
            ${{ env.GAR_LOCATION }}-docker.pkg.dev \
            --quiet

      # --------------------------------------------------
      # 8. Build and Push with Kaniko
      # --------------------------------------------------

      - name: Build and push Docker image with Kaniko
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            gcr.io/kaniko-project/executor:v1.23.2-debug \
            --dockerfile=/workspace/Dockerfile \
            --context=dir:///workspace \
            --destination=${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --destination=${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}:latest

      # --------------------------------------------------
      # 9. Get GKE credentials
      # --------------------------------------------------

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_REGION }}
          project_id: ${{ env.PROJECT_ID }}

      # --------------------------------------------------
      # 10. Deploy application to GKE
      # --------------------------------------------------

      - name: Deploy application
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml

      # --------------------------------------------------
      # 11. Verify deployment
      # --------------------------------------------------

      - name: Verify deployment
        run: |
          echo "===== Deployments ====="
          kubectl get deployments

          echo "===== Pods ====="
          kubectl get pods -o wide

          echo "===== Services ====="
          kubectl get services
