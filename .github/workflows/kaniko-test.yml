name: Kaniko OCI Annotation + GKE Deploy

on:
  workflow_dispatch:
    inputs:
      image_version:
        description: "Container image version"
        required: true
        default: "3.0.0"
        type: string

env:
  PROJECT_ID: clgcporg193-p001

  GKE_CLUSTER: kaniko-test
  GKE_REGION: us-central1

  GAR_LOCATION: us-central1
  GAR_REPOSITORY: kaniko-test
  IMAGE_NAME: kaniko-test

  OCI_SOURCE: https://github.com/megupatil/kaniko-test

  # Maintained Kaniko release with OCI annotation support
  KANIKO_IMAGE: ghcr.io/osscontainertools/kaniko:v1.28.0

jobs:
  kaniko-oci-annotation:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      # ==================================================
      # 1. Checkout repository
      # ==================================================

      - name: Checkout repository
        uses: actions/checkout@v5

      # ==================================================
      # 2. Authenticate to Google Cloud
      #
      # This creates the ADC credential file that will be
      # mounted into the Kaniko container.
      # ==================================================

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}'

      # ==================================================
      # 3. Setup Docker Buildx
      #
      # ONLY used later to inspect the OCI manifest.
      # It does NOT build the image.
      # ==================================================

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      # ==================================================
      # 4. Validate Kaniko annotation support
      # ==================================================

      - name: Verify Kaniko annotation support
        run: |
          echo "=============================================="
          echo "KANIKO VERSION"
          echo "=============================================="

          docker run --rm \
            "${KANIKO_IMAGE}" \
            version

          echo "=============================================="
          echo "CHECK --annotation"
          echo "=============================================="

          docker run --rm \
            "${KANIKO_IMAGE}" \
            --help > /tmp/kaniko-help.txt

          if grep -q -- "--annotation" /tmp/kaniko-help.txt; then
            echo "Kaniko supports --annotation"
          else
            echo "ERROR: ${KANIKO_IMAGE} does not expose --annotation"
            exit 1
          fi

      # ==================================================
      # 5. Build + PUSH with Kaniko
      #
      # The image is pushed directly to GAR because the
      # OCI manifest annotation needs to exist on the
      # registry-side image.
      # ==================================================

      - name: Build and push image with Kaniko
        run: |
          GAR_IMAGE="${GAR_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}"
          IMAGE_VERSION="${{ github.event.inputs.image_version }}"

          echo "=============================================="
          echo "KANIKO BUILD"
          echo "=============================================="

          echo "Kaniko image:"
          echo "${KANIKO_IMAGE}"

          echo "Version:"
          echo "${IMAGE_VERSION}"

          echo "Git SHA:"
          echo "${GITHUB_SHA}"

          echo "OCI source:"
          echo "${OCI_SOURCE}"

          echo "=============================================="
          echo "KANIKO BUILD + PUSH"
          echo "=============================================="

          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -v "${GOOGLE_APPLICATION_CREDENTIALS}:/workspace/gcp-key.json:ro" \
            -e GOOGLE_APPLICATION_CREDENTIALS=/workspace/gcp-key.json \
            "${KANIKO_IMAGE}" \
            --dockerfile=/workspace/Dockerfile \
            --context=dir:///workspace \
            --destination="${GAR_IMAGE}:${IMAGE_VERSION}" \
            --destination="${GAR_IMAGE}:${GITHUB_SHA}" \
            --destination="${GAR_IMAGE}:latest" \
            --annotation "org.opencontainers.image.source=${OCI_SOURCE}"

      # ==================================================
      # 6. Authenticate Docker client to GAR
      #
      # Kaniko does NOT need this.
      #
      # This is only needed because the next step uses
      # Docker Buildx to inspect the private registry image.
      # ==================================================

      - name: Configure Docker authentication for GAR
        run: |
          gcloud auth configure-docker \
            "${GAR_LOCATION}-docker.pkg.dev" \
            --quiet

      # ==================================================
      # 7. Inspect the raw OCI manifest
      #
      # This is the main validation.
      #
      # Look for:
      #
      # org.opencontainers.image.source
      #
      # in the manifest annotations.
      # ==================================================

      - name: Verify OCI manifest annotation
        run: |
          GAR_IMAGE="${GAR_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}"
          IMAGE_VERSION="${{ github.event.inputs.image_version }}"

          echo "=============================================="
          echo "RAW OCI MANIFEST"
          echo "=============================================="

          docker buildx imagetools inspect \
            "${GAR_IMAGE}:${IMAGE_VERSION}" \
            --raw

      # ==================================================
      # 8. Print image information
      # ==================================================

      - name: Verify image references
        run: |
          GAR_IMAGE="${GAR_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}"
          IMAGE_VERSION="${{ github.event.inputs.image_version }}"

          echo "=============================================="
          echo "IMAGE REFERENCES"
          echo "=============================================="

          echo "Version:"
          echo "${GAR_IMAGE}:${IMAGE_VERSION}"

          echo "Git SHA:"
          echo "${GAR_IMAGE}:${GITHUB_SHA}"

          echo "Latest:"
          echo "${GAR_IMAGE}:latest"

      # ==================================================
      # 9. Get GKE credentials
      # ==================================================

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_REGION }}
          project_id: ${{ env.PROJECT_ID }}

      # ==================================================
      # 10. Deploy Kubernetes manifests
      # ==================================================

      - name: Deploy Kubernetes manifests
        run: |
          echo "=============================================="
          echo "DEPLOY KUBERNETES MANIFESTS"
          echo "=============================================="

          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml

      # ==================================================
      # 11. Deploy exact image version
      # ==================================================

      - name: Set deployed image
        run: |
          GAR_IMAGE="${GAR_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}"
          IMAGE_VERSION="${{ github.event.inputs.image_version }}"

          echo "=============================================="
          echo "DEPLOY IMAGE"
          echo "=============================================="

          echo "${GAR_IMAGE}:${IMAGE_VERSION}"

          kubectl set image deployment/kaniko-test \
            kaniko-test="${GAR_IMAGE}:${IMAGE_VERSION}"

      # ==================================================
      # 12. Wait for rollout
      # ==================================================

      - name: Wait for rollout
        run: |
          kubectl rollout status \
            deployment/kaniko-test \
            --timeout=180s

      # ==================================================
      # 13. Verify deployed image
      # ==================================================

      - name: Verify deployed image
        run: |
          echo "=============================================="
          echo "DEPLOYMENT IMAGE"
          echo "=============================================="

          kubectl get deployment kaniko-test \
            -o jsonpath='{.spec.template.spec.containers[0].image}'

          echo

          echo "=============================================="
          echo "RUNNING POD IMAGE"
          echo "=============================================="

          kubectl get pods \
            -l app=kaniko-test \
            -o jsonpath='{range .items[*]}{.metadata.name}{" -> "}{.status.containerStatuses[0].image}{"\n"}{end}'

          echo "=============================================="
          echo "RUNNING IMAGE DIGEST"
          echo "=============================================="

          kubectl get pods \
            -l app=kaniko-test \
            -o jsonpath='{range .items[*]}{.metadata.name}{" -> "}{.status.containerStatuses[0].imageID}{"\n"}{end}'

      # ==================================================
      # 14. Final verification
      # ==================================================

      - name: Final verification
        run: |
          echo "=============================================="
          echo "DEPLOYMENT"
          echo "=============================================="

          kubectl get deployment kaniko-test

          echo "=============================================="
          echo "PODS"
          echo "=============================================="

          kubectl get pods \
            -l app=kaniko-test \
            -o wide

          echo "=============================================="
          echo "SERVICE"
          echo "=============================================="

          kubectl get service kaniko-test
