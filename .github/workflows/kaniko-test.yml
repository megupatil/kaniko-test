name: Kaniko OCI Annotation + GKE Deploy

on:
  workflow_dispatch:
    inputs:
      image_version:
        description: "Container image version"
        required: true
        default: "1.0.0"
        type: string

env:
  PROJECT_ID: clgcporg193-p001

  GKE_CLUSTER: kaniko-test
  GKE_REGION: us-central1

  GAR_LOCATION: us-central1
  GAR_REPOSITORY: kaniko-test
  IMAGE_NAME: kaniko-test

  OCI_SOURCE: https://github.com/megupatil/kaniko-test

  # Maintained Kaniko release with OCI annotation support
  KANIKO_IMAGE: ghcr.io/osscontainertools/kaniko:v1.28.0

jobs:
  kaniko-oci-annotation:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      # ==================================================
      # 1. Checkout repository
      # ==================================================

      - name: Checkout repository
        uses: actions/checkout@v5

      # ==================================================
      # 2. Authenticate to Google Cloud
      # ==================================================

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}'

      # ==================================================
      # 3. Setup gcloud
      # ==================================================

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      # ==================================================
      # 4. Configure Docker for Artifact Registry
      # ==================================================

      - name: Configure Docker
        run: |
          gcloud auth configure-docker \
            "${GAR_LOCATION}-docker.pkg.dev" \
            --quiet

      # ==================================================
      # 5. Check Kaniko annotation support
      # ==================================================

      - name: Verify Kaniko annotation support
        run: |
          echo "=============================================="
          echo "KANIKO VERSION"
          echo "=============================================="

          docker run --rm \
            "${KANIKO_IMAGE}" \
            version

          echo "=============================================="
          echo "CHECK --annotation"
          echo "=============================================="

          docker run --rm \
            "${KANIKO_IMAGE}" \
            --help > /tmp/kaniko-help.txt

          if grep -q -- "--annotation" /tmp/kaniko-help.txt; then
            echo "Kaniko supports --annotation"
          else
            echo "ERROR: Kaniko image does not expose --annotation"
            exit 1
          fi

      # ==================================================
      # 6. Build image with Kaniko + OCI annotation
      #
      # The image is pushed directly to GAR so that the
      # OCI manifest annotation is preserved in the
      # registry manifest.
      # ==================================================

      - name: Build and push annotated image with Kaniko
        run: |
          GAR_IMAGE="${GAR_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}"
          IMAGE_VERSION="${{ github.event.inputs.image_version }}"

          echo "=============================================="
          echo "KANIKO BUILD"
          echo "=============================================="

          echo "Image:"
          echo "${GAR_IMAGE}:${IMAGE_VERSION}"

          echo "Git SHA:"
          echo "${GITHUB_SHA}"

          echo "OCI source:"
          echo "${OCI_SOURCE}"

          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -e GOOGLE_APPLICATION_CREDENTIALS=/workspace/gcp-key.json \
            "${KANIKO_IMAGE}" \
            --dockerfile=/workspace/Dockerfile \
            --context=dir:///workspace \
            --destination="${GAR_IMAGE}:${IMAGE_VERSION}" \
            --destination="${GAR_IMAGE}:${GITHUB_SHA}" \
            --destination="${GAR_IMAGE}:latest" \
            --annotation "org.opencontainers.image.source=${OCI_SOURCE}"

      # ==================================================
      # 7. Verify image exists in Artifact Registry
      # ==================================================

      - name: Verify image in Artifact Registry
        run: |
          GAR_IMAGE="${GAR_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}"
          IMAGE_VERSION="${{ github.event.inputs.image_version }}"

          echo "=============================================="
          echo "ARTIFACT REGISTRY"
          echo "=============================================="

          gcloud artifacts docker images describe \
            "${GAR_IMAGE}:${IMAGE_VERSION}" \
            --format="yaml(name,version,updateTime)"

      # ==================================================
      # 8. Setup Docker Buildx
      #
      # Used only to inspect the OCI manifest.
      # It is NOT used to build the image.
      # ==================================================

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      # ==================================================
      # 9. Inspect raw OCI manifest
      #
      # This is the key validation step.
      # We want to see:
      #
      # org.opencontainers.image.source
      #
      # in the manifest annotations.
      # ==================================================

      - name: Verify OCI manifest annotation
        run: |
          GAR_IMAGE="${GAR_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}"
          IMAGE_VERSION="${{ github.event.inputs.image_version }}"

          echo "=============================================="
          echo "RAW OCI MANIFEST"
          echo "=============================================="

          docker buildx imagetools inspect \
            "${GAR_IMAGE}:${IMAGE_VERSION}" \
            --raw

      # ==================================================
      # 10. Deploy Kubernetes manifests
      # ==================================================

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_REGION }}
          project_id: ${{ env.PROJECT_ID }}

      - name: Deploy Kubernetes manifests
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml

      # ==================================================
      # 11. Deploy exact version
      # ==================================================

      - name: Set deployed image
        run: |
          GAR_IMAGE="${GAR_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}"
          IMAGE_VERSION="${{ github.event.inputs.image_version }}"

          kubectl set image deployment/kaniko-test \
            kaniko-test="${GAR_IMAGE}:${IMAGE_VERSION}"

      # ==================================================
      # 12. Wait for rollout
      # ==================================================

      - name: Wait for rollout
        run: |
          kubectl rollout status \
            deployment/kaniko-test \
            --timeout=180s

      # ==================================================
      # 13. Verify deployed image and digest
      # ==================================================

      - name: Verify deployed image
        run: |
          echo "=============================================="
          echo "DEPLOYMENT IMAGE"
          echo "=============================================="

          kubectl get deployment kaniko-test \
            -o jsonpath='{.spec.template.spec.containers[0].image}'

          echo

          echo "=============================================="
          echo "RUNNING POD IMAGE"
          echo "=============================================="

          kubectl get pods \
            -l app=kaniko-test \
            -o jsonpath='{range .items[*]}{.metadata.name}{" -> "}{.status.containerStatuses[0].image}{"\n"}{end}'

          echo "=============================================="
          echo "RUNNING IMAGE DIGEST"
          echo "=============================================="

          kubectl get pods \
            -l app=kaniko-test \
            -o jsonpath='{range .items[*]}{.metadata.name}{" -> "}{.status.containerStatuses[0].imageID}{"\n"}{end}'

      # ==================================================
      # 14. Final verification
      # ==================================================

      - name: Final verification
        run: |
          echo "=============================================="
          echo "DEPLOYMENT"
          echo "=============================================="

          kubectl get deployment kaniko-test

          echo "=============================================="
          echo "PODS"
          echo "=============================================="

          kubectl get pods \
            -l app=kaniko-test \
            -o wide

          echo "=============================================="
          echo "SERVICE"
          echo "=============================================="

          kubectl get service kaniko-test
