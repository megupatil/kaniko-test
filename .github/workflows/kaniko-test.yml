name: Kaniko Build + Wiz CLI Scan + GKE Deploy

on:
  workflow_dispatch:

env:
  PROJECT_ID: clgcporg193-p001
  GKE_CLUSTER: kaniko-test
  GKE_REGION: us-central1

  GAR_LOCATION: us-central1
  GAR_REPOSITORY: kaniko-test
  IMAGE_NAME: kaniko-test

jobs:
  kaniko-build-and-deploy:
    runs-on: ubuntu-latest

    env:
      WIZ_CLIENT_ID: ${{ secrets.WIZ_CLIENT_ID }}
      WIZ_CLIENT_SECRET: ${{ secrets.WIZ_CLIENT_SECRET }}

    steps:

      # --------------------------------------------------
      # Checkout
      # --------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v5

      # --------------------------------------------------
      # Wiz CLI
      # --------------------------------------------------

      - name: Install Wiz CLI
        run: |
          curl -Lo wizcli https://downloads.wiz.io/v1/wizcli/latest/wizcli-linux-amd64
          chmod +x wizcli
          ./wizcli version

      - name: Scan repository with Wiz CLI
        run: |
          ./wizcli scan dir .

      # --------------------------------------------------
      # Authenticate to Google Cloud
      # --------------------------------------------------

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}'

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      # --------------------------------------------------
      # Artifact Registry authentication
      # --------------------------------------------------

      - name: Configure Docker
        run: |
          gcloud auth configure-docker \
            ${{ env.GAR_LOCATION }}-docker.pkg.dev \
            --quiet

      # --------------------------------------------------
      # Build and Push with Kaniko
      # --------------------------------------------------

      - name: Build and push Docker image with Kaniko
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            gcr.io/kaniko-project/executor:v1.23.2-debug \
            --dockerfile=/workspace/Dockerfile \
            --context=dir:///workspace \
            --destination=${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --destination=${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}:latest

      # --------------------------------------------------
      # Get GKE credentials
      # --------------------------------------------------

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_REGION }}
          project_id: ${{ env.PROJECT_ID }}

      # --------------------------------------------------
      # Deploy to GKE
      # --------------------------------------------------

      - name: Deploy application
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml

      # --------------------------------------------------
      # Verify
      # --------------------------------------------------

      - name: Verify deployment
        run: |
          kubectl get deployment
          kubectl get pods
          kubectl get service
