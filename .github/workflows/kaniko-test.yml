name: Kaniko Build + Wiz CLI Scan + GKE Deploy

on:
  workflow_dispatch:

env:
  PROJECT_ID: clgcporg193-p001

  GKE_CLUSTER: kaniko-test
  GKE_REGION: us-central1

  GAR_LOCATION: us-central1
  GAR_REPOSITORY: kaniko-test
  IMAGE_NAME: kaniko-test

jobs:
  kaniko-build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v5

      # --------------------------------------------------
      # 2. Install Wiz CLI
      # --------------------------------------------------

      - name: Install Wiz CLI
        run: |
          curl -Lo wizcli https://downloads.wiz.io/v1/wizcli/latest/wizcli-linux-amd64
          chmod +x wizcli
          ./wizcli version

      # --------------------------------------------------
      # 3. Authenticate to Wiz
      # --------------------------------------------------

      - name: Authenticate to Wiz
        env:
          WIZ_CLIENT_ID: ${{ secrets.WIZ_CLIENT_ID }}
          WIZ_CLIENT_SECRET: ${{ secrets.WIZ_CLIENT_SECRET }}
        run: |
          ./wizcli auth \
            --id "$WIZ_CLIENT_ID" \
            --secret "$WIZ_CLIENT_SECRET"

      # --------------------------------------------------
      # 4. Scan source repository with Wiz
      # --------------------------------------------------

      - name: Scan repository with Wiz CLI
        continue-on-error: true
        run: |
          echo "=============================================="
          echo "WIZ SOURCE REPOSITORY SCAN"
          echo "=============================================="

          ./wizcli dir scan --path .

      # --------------------------------------------------
      # 5. Authenticate to Google Cloud
      # --------------------------------------------------

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}'

      # --------------------------------------------------
      # 6. Setup gcloud
      # --------------------------------------------------

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      # --------------------------------------------------
      # 7. Configure Docker for Artifact Registry
      # --------------------------------------------------

      - name: Configure Docker
        run: |
          gcloud auth configure-docker \
            ${{ env.GAR_LOCATION }}-docker.pkg.dev \
            --quiet

      # --------------------------------------------------
      # 8. Build image with Kaniko
      #
      # Kaniko builds the image but does NOT push it.
      # The image is exported as image.tar.
      # --------------------------------------------------

      - name: Build image with Kaniko
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            gcr.io/kaniko-project/executor:v1.23.2-debug \
            --dockerfile=/workspace/Dockerfile \
            --context=dir:///workspace \
            --destination=${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --no-push \
            --tar-path=/workspace/image.tar

      # --------------------------------------------------
      # 9. Verify Kaniko image archive
      # --------------------------------------------------

      - name: Verify Kaniko image
        run: |
          echo "=============================================="
          echo "KANIKO IMAGE"
          echo "=============================================="

          ls -lh image.tar

      # --------------------------------------------------
      # 10. Load Kaniko-built image into Docker
      # --------------------------------------------------

      - name: Load Kaniko image
        run: |
          echo "=============================================="
          echo "LOAD KANIKO IMAGE"
          echo "=============================================="

          docker load -i image.tar

          echo "=============================================="
          echo "LOCAL DOCKER IMAGES"
          echo "=============================================="

          docker images

      # --------------------------------------------------
      # 11. Tag image for Artifact Registry
      #
      # IMPORTANT:
      # This creates a LOCAL tag only.
      # Nothing is pushed to GAR yet.
      # --------------------------------------------------

      - name: Tag image for Artifact Registry
        run: |
          GAR_IMAGE="${GAR_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}"

          echo "=============================================="
          echo "TAGGING LOCAL IMAGE FOR ARTIFACT REGISTRY"
          echo "=============================================="

          echo "GAR IMAGE:"
          echo "${GAR_IMAGE}:${GITHUB_SHA}"

          docker tag \
            "${IMAGE_NAME}:${GITHUB_SHA}" \
            "${GAR_IMAGE}:${GITHUB_SHA}"

          docker tag \
            "${IMAGE_NAME}:${GITHUB_SHA}" \
            "${GAR_IMAGE}:latest"

          echo "=============================================="
          echo "GAR-TAGGED LOCAL IMAGES"
          echo "=============================================="

          docker images "${GAR_IMAGE}"

      # --------------------------------------------------
      # 12. Scan the exact GAR-tagged image with Wiz
      #
      # This scans the image locally.
      # It is NOT yet pushed to Artifact Registry.
      # Results are displayed but do not block the workflow.
      # --------------------------------------------------

      - name: Scan Kaniko-built image with Wiz CLI
        continue-on-error: true
        run: |
          GAR_IMAGE="${GAR_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}"

          echo "=============================================="
          echo "WIZ CONTAINER IMAGE SCAN"
          echo "=============================================="

          echo "Scanning image:"
          echo "${GAR_IMAGE}:${GITHUB_SHA}"

          echo "=============================================="
          echo "WIZ SCAN RESULTS"
          echo "=============================================="

          ./wizcli docker scan \
            --image "${GAR_IMAGE}:${GITHUB_SHA}"

      # --------------------------------------------------
      # 13. Push image to Artifact Registry
      #
      # This is the first point where the image is
      # actually published to GAR.
      # --------------------------------------------------

      - name: Push image to Artifact Registry
        run: |
          GAR_IMAGE="${GAR_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}"

          echo "=============================================="
          echo "PUSHING IMAGE TO ARTIFACT REGISTRY"
          echo "=============================================="

          docker push "${GAR_IMAGE}:${GITHUB_SHA}"
          docker push "${GAR_IMAGE}:latest"

      # --------------------------------------------------
      # 14. Get GKE credentials
      # --------------------------------------------------

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_REGION }}
          project_id: ${{ env.PROJECT_ID }}

      # --------------------------------------------------
      # 15. Deploy Kubernetes manifests
      # --------------------------------------------------

      - name: Deploy application
        run: |
          echo "=============================================="
          echo "DEPLOYING KUBERNETES MANIFESTS"
          echo "=============================================="

          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml

      # --------------------------------------------------
      # 16. Set exact image version
      # --------------------------------------------------

      - name: Set deployed image
        run: |
          GAR_IMAGE="${GAR_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}"

          echo "=============================================="
          echo "DEPLOYING IMAGE"
          echo "=============================================="

          echo "${GAR_IMAGE}:${GITHUB_SHA}"

          kubectl set image deployment/kaniko-test \
            kaniko-test="${GAR_IMAGE}:${GITHUB_SHA}"

      # --------------------------------------------------
      # 17. Check deployment state
      # --------------------------------------------------

      - name: Check deployment state
        run: |
          echo "=============================================="
          echo "DEPLOYMENT"
          echo "=============================================="

          kubectl get deployment kaniko-test -o wide

          echo "=============================================="
          echo "REPLICASETS"
          echo "=============================================="

          kubectl get replicasets -l app=kaniko-test

          echo "=============================================="
          echo "PODS"
          echo "=============================================="

          kubectl get pods \
            -l app=kaniko-test \
            -o wide

          echo "=============================================="
          echo "EVENTS"
          echo "=============================================="

          kubectl get events \
            --sort-by=.lastTimestamp | tail -50

      # --------------------------------------------------
      # 18. Wait for rollout
      # --------------------------------------------------

      - name: Wait for rollout
        run: |
          kubectl rollout status \
            deployment/kaniko-test \
            --timeout=180s

      # --------------------------------------------------
      # 19. Final verification
      # --------------------------------------------------

      - name: Verify deployment
        run: |
          echo "=============================================="
          echo "FINAL DEPLOYMENT"
          echo "=============================================="

          kubectl get deployment kaniko-test

          echo "=============================================="
          echo "FINAL PODS"
          echo "=============================================="

          kubectl get pods \
            -l app=kaniko-test \
            -o wide

          echo "=============================================="
          echo "SERVICE"
          echo "=============================================="

          kubectl get service kaniko-test
