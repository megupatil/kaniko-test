name: Kaniko Build + Wiz CLI Scan + GKE Deploy

on:
  workflow_dispatch:

env:
  PROJECT_ID: clgcporg193-p001

  GKE_CLUSTER: kaniko-test
  GKE_REGION: us-central1

  GAR_LOCATION: us-central1
  GAR_REPOSITORY: kaniko-test
  IMAGE_NAME: kaniko-test

  # Source repository used for OCI manifest annotation
  OCI_SOURCE: https://github.com/megupatil/kaniko-test

jobs:
  kaniko-build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      # ==================================================
      # 1. Checkout repository
      # ==================================================

      - name: Checkout repository
        uses: actions/checkout@v5

      # ==================================================
      # 2. Install Wiz CLI
      # ==================================================

      - name: Install Wiz CLI
        run: |
          curl -Lo wizcli https://downloads.wiz.io/v1/wizcli/latest/wizcli-linux-amd64
          chmod +x wizcli

          echo "=============================================="
          echo "WIZ CLI VERSION"
          echo "=============================================="

          ./wizcli version

      # ==================================================
      # 3. Validate Wiz CLI commands
      # ==================================================

      - name: Validate Wiz CLI commands
        run: |
          echo "=============================================="
          echo "WIZ SCAN CONTAINER-IMAGE HELP"
          echo "=============================================="

          ./wizcli scan container-image --help

          echo "=============================================="
          echo "WIZ TAG HELP"
          echo "=============================================="

          ./wizcli tag --help

      # ==================================================
      # 4. Validate Kaniko annotation support
      #
      # IMPORTANT:
      # This validates the exact Kaniko executor version
      # being used below.
      # ==================================================

      - name: Validate Kaniko annotation support
        run: |
          echo "=============================================="
          echo "KANIKO ANNOTATION SUPPORT"
          echo "=============================================="

          docker run --rm \
            gcr.io/kaniko-project/executor:v1.23.2-debug \
            --help > /tmp/kaniko-help.txt

          if grep -q -- "--annotation" /tmp/kaniko-help.txt; then
            echo "Kaniko executor supports --annotation"
          else
            echo "ERROR: Kaniko v1.23.2-debug does not expose --annotation"
            echo
            echo "Kaniko help output:"
            cat /tmp/kaniko-help.txt
            exit 1
          fi

      # ==================================================
      # 5. Authenticate to Wiz
      # ==================================================

      - name: Authenticate to Wiz
        env:
          WIZ_CLIENT_ID: ${{ secrets.WIZ_CLIENT_ID }}
          WIZ_CLIENT_SECRET: ${{ secrets.WIZ_CLIENT_SECRET }}
        run: |
          ./wizcli auth \
            --id "$WIZ_CLIENT_ID" \
            --secret "$WIZ_CLIENT_SECRET"

      # ==================================================
      # 6. Scan source repository with Wiz
      #
      # Reporting only.
      # Does not block the pipeline.
      # ==================================================

      - name: Scan repository with Wiz CLI
        continue-on-error: true
        run: |
          echo "=============================================="
          echo "WIZ SOURCE REPOSITORY SCAN"
          echo "=============================================="

          ./wizcli dir scan --path .

      # ==================================================
      # 7. Authenticate to Google Cloud
      # ==================================================

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}'

      # ==================================================
      # 8. Setup gcloud
      # ==================================================

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      # ==================================================
      # 9. Configure Docker for Artifact Registry
      # ==================================================

      - name: Configure Docker
        run: |
          gcloud auth configure-docker \
            "${GAR_LOCATION}-docker.pkg.dev" \
            --quiet

      # ==================================================
      # 10. Build container image with Kaniko
      #
      # Kaniko:
      # - builds the image
      # - does NOT push it
      # - exports it to image.tar
      # - attempts to add a manifest-level OCI annotation
      # ==================================================

      - name: Build image with Kaniko
        run: |
          echo "=============================================="
          echo "KANIKO BUILD"
          echo "=============================================="

          echo "Image:"
          echo "${IMAGE_NAME}:${GITHUB_SHA}"

          echo "OCI source annotation:"
          echo "org.opencontainers.image.source=${OCI_SOURCE}"

          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            gcr.io/kaniko-project/executor:v1.23.2-debug \
            --dockerfile=/workspace/Dockerfile \
            --context=dir:///workspace \
            --destination="${IMAGE_NAME}:${GITHUB_SHA}" \
            --no-push \
            --tar-path=/workspace/image.tar \
            --annotation "org.opencontainers.image.source=${OCI_SOURCE}"

      # ==================================================
      # 11. Verify Kaniko output
      # ==================================================

      - name: Verify Kaniko image archive
        run: |
          echo "=============================================="
          echo "KANIKO IMAGE ARCHIVE"
          echo "=============================================="

          ls -lh image.tar

      # ==================================================
      # 12. Load Kaniko image into Docker
      # ==================================================

      - name: Load Kaniko image
        run: |
          echo "=============================================="
          echo "LOAD KANIKO IMAGE"
          echo "=============================================="

          docker load -i image.tar

          echo "=============================================="
          echo "LOCAL IMAGES"
          echo "=============================================="

          docker images

      # ==================================================
      # 13. Create GAR-qualified local image tag
      #
      # docker tag does NOT push anything.
      # ==================================================

      - name: Tag image for Artifact Registry
        run: |
          GAR_IMAGE="${GAR_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}"

          echo "=============================================="
          echo "GAR IMAGE REFERENCE"
          echo "=============================================="

          echo "${GAR_IMAGE}:${GITHUB_SHA}"

          docker tag \
            "${IMAGE_NAME}:${GITHUB_SHA}" \
            "${GAR_IMAGE}:${GITHUB_SHA}"

          docker tag \
            "${IMAGE_NAME}:${GITHUB_SHA}" \
            "${GAR_IMAGE}:latest"

          echo "=============================================="
          echo "GAR-TAGGED LOCAL IMAGE"
          echo "=============================================="

          docker images "${GAR_IMAGE}"

      # ==================================================
      # 14. Scan built image with Wiz
      #
      # Explicit Dockerfile mapping.
      # Reporting only - does not block pipeline.
      # ==================================================

      - name: Scan container image with Wiz CLI
        continue-on-error: true
        run: |
          GAR_IMAGE="${GAR_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}"

          echo "=============================================="
          echo "WIZ CONTAINER IMAGE SCAN"
          echo "=============================================="

          echo "Image:"
          echo "${GAR_IMAGE}:${GITHUB_SHA}"

          echo "Dockerfile:"
          echo "${GITHUB_WORKSPACE}/Dockerfile"

          echo "=============================================="
          echo "WIZ SCAN RESULTS"
          echo "=============================================="

          ./wizcli scan container-image \
            "${GAR_IMAGE}:${GITHUB_SHA}" \
            --dockerfile "${GITHUB_WORKSPACE}/Dockerfile"

      # ==================================================
      # 15. Push image to Artifact Registry
      #
      # This is the first actual registry publication.
      # ==================================================

      - name: Push image to Artifact Registry
        run: |
          GAR_IMAGE="${GAR_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}"

          echo "=============================================="
          echo "PUSH TO ARTIFACT REGISTRY"
          echo "=============================================="

          docker push "${GAR_IMAGE}:${GITHUB_SHA}"
          docker push "${GAR_IMAGE}:latest"

      # ==================================================
      # 16. Verify image in Artifact Registry
      # ==================================================

      - name: Verify image in Artifact Registry
        run: |
          GAR_IMAGE="${GAR_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}"

          echo "=============================================="
          echo "ARTIFACT REGISTRY IMAGE"
          echo "=============================================="

          gcloud artifacts docker images describe \
            "${GAR_IMAGE}:${GITHUB_SHA}" \
            --format="yaml(name,version,updateTime)"

      # ==================================================
      # 17. Wiz tag / digest correlation
      #
      # Runs AFTER the image is pushed to GAR.
      # ==================================================

      - name: Tag image in Wiz
        run: |
          GAR_IMAGE="${GAR_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}"

          echo "=============================================="
          echo "WIZ IMAGE TAG / DIGEST CORRELATION"
          echo "=============================================="

          echo "Image:"
          echo "${GAR_IMAGE}:${GITHUB_SHA}"

          ./wizcli tag \
            "${GAR_IMAGE}:${GITHUB_SHA}"

      # ==================================================
      # 18. Get GKE credentials
      # ==================================================

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_REGION }}
          project_id: ${{ env.PROJECT_ID }}

      # ==================================================
      # 19. Deploy Kubernetes manifests
      # ==================================================

      - name: Deploy application
        run: |
          echo "=============================================="
          echo "DEPLOY KUBERNETES MANIFESTS"
          echo "=============================================="

          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml

      # ==================================================
      # 20. Deploy exact image scanned and pushed
      # ==================================================

      - name: Set deployed image
        run: |
          GAR_IMAGE="${GAR_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}"

          echo "=============================================="
          echo "DEPLOY IMAGE"
          echo "=============================================="

          echo "${GAR_IMAGE}:${GITHUB_SHA}"

          kubectl set image deployment/kaniko-test \
            kaniko-test="${GAR_IMAGE}:${GITHUB_SHA}"

      # ==================================================
      # 21. Check deployment state
      # ==================================================

      - name: Check deployment state
        run: |
          echo "=============================================="
          echo "DEPLOYMENT"
          echo "=============================================="

          kubectl get deployment kaniko-test -o wide

          echo "=============================================="
          echo "REPLICASETS"
          echo "=============================================="

          kubectl get replicasets -l app=kaniko-test

          echo "=============================================="
          echo "PODS"
          echo "=============================================="

          kubectl get pods \
            -l app=kaniko-test \
            -o wide

          echo "=============================================="
          echo "EVENTS"
          echo "=============================================="

          kubectl get events \
            --sort-by=.lastTimestamp | tail -50

      # ==================================================
      # 22. Wait for rollout
      # ==================================================

      - name: Wait for rollout
        run: |
          kubectl rollout status \
            deployment/kaniko-test \
            --timeout=180s

      # ==================================================
      # 23. Verify deployed image
      # ==================================================

      - name: Verify deployed image
        run: |
          echo "=============================================="
          echo "DEPLOYMENT IMAGE"
          echo "=============================================="

          kubectl get deployment kaniko-test \
            -o jsonpath='{.spec.template.spec.containers[0].image}'

          echo

          echo "=============================================="
          echo "RUNNING POD IMAGE"
          echo "=============================================="

          kubectl get pods \
            -l app=kaniko-test \
            -o jsonpath='{range .items[*]}{.metadata.name}{" -> "}{.status.containerStatuses[0].image}{"\n"}{end}'

          echo "=============================================="
          echo "RUNNING IMAGE DIGEST"
          echo "=============================================="

          kubectl get pods \
            -l app=kaniko-test \
            -o jsonpath='{range .items[*]}{.metadata.name}{" -> "}{.status.containerStatuses[0].imageID}{"\n"}{end}'

      # ==================================================
      # 24. Final verification
      # ==================================================

      - name: Verify deployment
        run: |
          echo "=============================================="
          echo "FINAL DEPLOYMENT"
          echo "=============================================="

          kubectl get deployment kaniko-test

          echo "=============================================="
          echo "FINAL PODS"
          echo "=============================================="

          kubectl get pods \
            -l app=kaniko-test \
            -o wide

          echo "=============================================="
          echo "SERVICE"
          echo "=============================================="

          kubectl get service kaniko-test
