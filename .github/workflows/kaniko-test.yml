name: Kaniko OCI Annotation + GKE Deploy

on:
  workflow_dispatch:
    inputs:
      image_version:
        description: "Container image version"
        required: true
        default: "3.0.0"
        type: string

env:
  PROJECT_ID: clgcporg193-p001

  GKE_CLUSTER: kaniko-test
  GKE_REGION: us-central1

  GAR_LOCATION: us-central1
  GAR_REPOSITORY: kaniko-test
  IMAGE_NAME: kaniko-test

  # Git repository that Wiz should correlate to
  OCI_SOURCE: https://github.com/megupatil/kaniko-test

  # Maintained Kaniko release with OCI annotation support
  KANIKO_IMAGE: ghcr.io/osscontainertools/kaniko:v1.28.0

jobs:
  kaniko-oci-annotation:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      # ==================================================
      # 1. Checkout repository
      # ==================================================

      - name: Checkout repository
        uses: actions/checkout@v5

      # ==================================================
      # 2. Authenticate to Google Cloud
      #
      # Creates ADC credentials used by Kaniko to push
      # directly to Artifact Registry.
      # ==================================================

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}'

      # ==================================================
      # 3. Setup gcloud
      # ==================================================

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      # ==================================================
      # 4. Setup Docker Buildx
      #
      # Buildx is NOT used to build the image.
      # It is only used later to inspect the registry
      # manifest and verify the OCI annotation.
      # ==================================================

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      # ==================================================
      # 5. Validate Kaniko annotation support
      # ==================================================

      - name: Verify Kaniko annotation support
        run: |
          echo "=============================================="
          echo "KANIKO VERSION"
          echo "=============================================="

          docker run --rm \
            "${KANIKO_IMAGE}" \
            version

          echo "=============================================="
          echo "CHECK --annotation"
          echo "=============================================="

          docker run --rm \
            "${KANIKO_IMAGE}" \
            --help > /tmp/kaniko-help.txt

          if grep -q -- "--annotation" /tmp/kaniko-help.txt; then
            echo "Kaniko supports --annotation"
          else
            echo "ERROR: ${KANIKO_IMAGE} does not expose --annotation"
            exit 1
          fi

      # ==================================================
      # 6. Build and push with Kaniko
      #
      # This is the actual image build.
      #
      # Image tag follows customer-style convention:
      #
      # v3.0.0-stage
      #
      # OCI annotation:
      #
      # org.opencontainers.image.source
      # ==================================================

      - name: Build and push image with Kaniko
        run: |
          GAR_IMAGE="${GAR_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}"
          IMAGE_VERSION="${{ github.event.inputs.image_version }}"
          IMAGE_TAG="v${IMAGE_VERSION}-stage"

          echo "=============================================="
          echo "KANIKO BUILD + PUSH"
          echo "=============================================="

          echo "Kaniko:"
          echo "${KANIKO_IMAGE}"

          echo "Image:"
          echo "${GAR_IMAGE}:${IMAGE_TAG}"

          echo "OCI source:"
          echo "${OCI_SOURCE}"

          echo "=============================================="
          echo "BUILDING IMAGE"
          echo "=============================================="

          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -v "${GOOGLE_APPLICATION_CREDENTIALS}:/workspace/gcp-key.json:ro" \
            -e GOOGLE_APPLICATION_CREDENTIALS=/workspace/gcp-key.json \
            "${KANIKO_IMAGE}" \
            --dockerfile=/workspace/Dockerfile \
            --context=dir:///workspace \
            --destination="${GAR_IMAGE}:${IMAGE_TAG}" \
            --annotation "org.opencontainers.image.source=${OCI_SOURCE}"

      # ==================================================
      # 7. Authenticate Docker for registry inspection
      #
      # This is NOT for Kaniko.
      #
      # It is only required because Buildx will read the
      # private GAR manifest in the next step.
      # ==================================================

      - name: Configure Docker authentication for GAR
        run: |
          gcloud auth configure-docker \
            "${GAR_LOCATION}-docker.pkg.dev" \
            --quiet

      # ==================================================
      # 8. Verify image exists in GAR
      # ==================================================

      - name: Verify image in Artifact Registry
        run: |
          GAR_IMAGE="${GAR_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}"
          IMAGE_VERSION="${{ github.event.inputs.image_version }}"
          IMAGE_TAG="v${IMAGE_VERSION}-stage"

          echo "=============================================="
          echo "ARTIFACT REGISTRY IMAGE"
          echo "=============================================="

          echo "Image:"
          echo "${GAR_IMAGE}:${IMAGE_TAG}"

          gcloud artifacts docker images describe \
            "${GAR_IMAGE}:${IMAGE_TAG}" \
            --format="yaml(name,version,updateTime)"

      # ==================================================
      # 9. Inspect raw OCI manifest
      #
      # THIS IS THE KEY TEST.
      #
      # We want to see:
      #
      # org.opencontainers.image.source
      #
      # under the manifest/index annotations.
      # ==================================================

      - name: Verify OCI manifest annotation
        run: |
          GAR_IMAGE="${GAR_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}"
          IMAGE_VERSION="${{ github.event.inputs.image_version }}"
          IMAGE_TAG="v${IMAGE_VERSION}-stage"

          echo "=============================================="
          echo "RAW OCI MANIFEST"
          echo "=============================================="

          docker buildx imagetools inspect \
            "${GAR_IMAGE}:${IMAGE_TAG}" \
            --raw

      # ==================================================
      # 10. Get GKE credentials
      # ==================================================

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_REGION }}
          project_id: ${{ env.PROJECT_ID }}

      # ==================================================
      # 11. Deploy Kubernetes manifests
      # ==================================================

      - name: Deploy Kubernetes manifests
        run: |
          echo "=============================================="
          echo "DEPLOY KUBERNETES MANIFESTS"
          echo "=============================================="

          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml

      # ==================================================
      # 12. Deploy the annotated image
      # ==================================================

      - name: Set deployed image
        run: |
          GAR_IMAGE="${GAR_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}"
          IMAGE_VERSION="${{ github.event.inputs.image_version }}"
          IMAGE_TAG="v${IMAGE_VERSION}-stage"

          echo "=============================================="
          echo "DEPLOY IMAGE"
          echo "=============================================="

          echo "${GAR_IMAGE}:${IMAGE_TAG}"

          kubectl set image deployment/kaniko-test \
            kaniko-test="${GAR_IMAGE}:${IMAGE_TAG}"

      # ==================================================
      # 13. Wait for rollout
      # ==================================================

      - name: Wait for rollout
        run: |
          kubectl rollout status \
            deployment/kaniko-test \
            --timeout=180s

      # ==================================================
      # 14. Verify deployed image
      # ==================================================

      - name: Verify deployed image
        run: |
          echo "=============================================="
          echo "DEPLOYMENT IMAGE"
          echo "=============================================="

          kubectl get deployment kaniko-test \
            -o jsonpath='{.spec.template.spec.containers[0].image}'

          echo

          echo "=============================================="
          echo "RUNNING POD IMAGE"
          echo "=============================================="

          kubectl get pods \
            -l app=kaniko-test \
            -o jsonpath='{range .items[*]}{.metadata.name}{" -> "}{.status.containerStatuses[0].image}{"\n"}{end}'

          echo "=============================================="
          echo "RUNNING IMAGE DIGEST"
          echo "=============================================="

          kubectl get pods \
            -l app=kaniko-test \
            -o jsonpath='{range .items[*]}{.metadata.name}{" -> "}{.status.containerStatuses[0].imageID}{"\n"}{end}'

      # ==================================================
      # 15. Final verification
      # ==================================================

      - name: Final verification
        run: |
          echo "=============================================="
          echo "DEPLOYMENT"
          echo "=============================================="

          kubectl get deployment kaniko-test

          echo "=============================================="
          echo "PODS"
          echo "=============================================="

          kubectl get pods \
            -l app=kaniko-test \
            -o wide

          echo "=============================================="
          echo "SERVICE"
          echo "=============================================="

          kubectl get service kaniko-test
