name: Kaniko Build + Wiz CLI Scan + GKE Deploy

on:
  workflow_dispatch:

env:
  PROJECT_ID: clgcporg193-p001

  GKE_CLUSTER: kaniko-test
  GKE_REGION: us-central1

  GAR_LOCATION: us-central1
  GAR_REPOSITORY: kaniko-test
  IMAGE_NAME: kaniko-test

jobs:
  kaniko-build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v5

      # --------------------------------------------------
      # 2. Install Wiz CLI
      # --------------------------------------------------

      - name: Install Wiz CLI
        run: |
          curl -Lo wizcli https://downloads.wiz.io/v1/wizcli/latest/wizcli-linux-amd64
          chmod +x wizcli
          ./wizcli version

      # --------------------------------------------------
      # 3. Authenticate to Wiz
      # --------------------------------------------------

      - name: Authenticate to Wiz
        env:
          WIZ_CLIENT_ID: ${{ secrets.WIZ_CLIENT_ID }}
          WIZ_CLIENT_SECRET: ${{ secrets.WIZ_CLIENT_SECRET }}
        run: |
          ./wizcli auth \
            --id "$WIZ_CLIENT_ID" \
            --secret "$WIZ_CLIENT_SECRET"

      # --------------------------------------------------
      # 4. Scan source repository
      # --------------------------------------------------

      - name: Scan repository with Wiz CLI
        continue-on-error: true
        run: |
          echo "===== Wiz Repository Scan ====="
          ./wizcli dir scan --path .

      # --------------------------------------------------
      # 5. Authenticate to Google Cloud
      # --------------------------------------------------

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}'

      # --------------------------------------------------
      # 6. Setup gcloud
      # --------------------------------------------------

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      # --------------------------------------------------
      # 7. Configure Docker for Artifact Registry
      # --------------------------------------------------

      - name: Configure Docker
        run: |
          gcloud auth configure-docker \
            ${{ env.GAR_LOCATION }}-docker.pkg.dev \
            --quiet

      # --------------------------------------------------
      # 8. Build image with Kaniko
      #
      # No push to GAR at this stage.
      # --------------------------------------------------

      - name: Build image with Kaniko
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            gcr.io/kaniko-project/executor:v1.23.2-debug \
            --dockerfile=/workspace/Dockerfile \
            --context=dir:///workspace \
            --destination=${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --no-push \
            --tar-path=/workspace/image.tar

      # --------------------------------------------------
      # 9. Verify Kaniko image
      # --------------------------------------------------

      - name: Verify Kaniko image
        run: |
          echo "===== Kaniko Image Archive ====="
          ls -lh image.tar

      # --------------------------------------------------
      # 10. Load Kaniko image into Docker
      # --------------------------------------------------

      - name: Load Kaniko image
        run: |
          echo "===== Loading Kaniko Image ====="
          docker load -i image.tar
          docker images

      # --------------------------------------------------
      # 11. Scan the image built by Kaniko
      #
      # Scan results are displayed.
      # Workflow continues regardless of scan result.
      # --------------------------------------------------

      - name: Scan Kaniko-built image with Wiz CLI
        continue-on-error: true
        run: |
          echo "=============================================="
          echo "WIZ SCAN RESULTS - KANIKO BUILT IMAGE"
          echo "=============================================="

          ./wizcli docker scan \
            --image "${{ env.IMAGE_NAME }}:${{ github.sha }}"

      # --------------------------------------------------
      # 12. Tag image for Artifact Registry
      # --------------------------------------------------

      - name: Tag image for Artifact Registry
        run: |
          GAR_IMAGE="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}"

          docker tag \
            "${{ env.IMAGE_NAME }}:${{ github.sha }}" \
            "${GAR_IMAGE}:${{ github.sha }}"

          docker tag \
            "${{ env.IMAGE_NAME }}:${{ github.sha }}" \
            "${GAR_IMAGE}:latest"

      # --------------------------------------------------
      # 13. Push image to Artifact Registry
      # --------------------------------------------------

      - name: Push image to Artifact Registry
        run: |
          GAR_IMAGE="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}"

          docker push "${GAR_IMAGE}:${{ github.sha }}"
          docker push "${GAR_IMAGE}:latest"

      # --------------------------------------------------
      # 14. Get GKE credentials
      # --------------------------------------------------

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_REGION }}
          project_id: ${{ env.PROJECT_ID }}

      # --------------------------------------------------
      # 15. Deploy to GKE
      # --------------------------------------------------

      - name: Deploy application
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml

      # --------------------------------------------------
      # 16. Deploy exact image version
      # --------------------------------------------------

      - name: Set deployed image
        run: |
          GAR_IMAGE="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}"

          kubectl set image deployment/kaniko-test \
            kaniko-test="${GAR_IMAGE}:${{ github.sha }}"

      # --------------------------------------------------
      # 17. Wait for deployment
      # --------------------------------------------------

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/kaniko-test --timeout=180s

      # --------------------------------------------------
      # 18. Verify deployment
      # --------------------------------------------------

      - name: Verify deployment
        run: |
          echo "===== DEPLOYMENT ====="
          kubectl get deployment kaniko-test

          echo "===== PODS ====="
          kubectl get pods -l app=kaniko-test -o wide

          echo "===== SERVICES ====="
          kubectl get service kaniko-test
